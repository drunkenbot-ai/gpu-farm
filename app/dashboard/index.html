<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GPU Farm Manager</title><link rel="stylesheet" href="/dashboard/style.css"></head><body><header><h1>GPU Farm Manager</h1><span id="connection">Connecting…</span></header><main><section id="summary" class="cards"></section><section><h2>Submit training job</h2><form id="job-form"><label>TrainingJobSpec JSON<textarea id="job-json" required placeholder="Paste TrainingJobSpec JSON"></textarea></label><label>Pool<select id="job-pool"><option value="">Any eligible worker</option></select></label><label>Cloud estimate<input id="job-hours" type="number" value="1" min="0.01" step="0.01"></label><button>Submit</button></form><p class="hint">Set browser local-storage keys <code>farmAdminToken</code> and, for cloud jobs, <code>cloudApiKey</code>.</p></section><section><h2>Cloud entitlement</h2><p id="cloud">Loading…</p></section><section><h2>Workers</h2><table><thead><tr><th>ID</th><th>Status</th><th>Backend</th><th>Host</th></tr></thead><tbody id="workers"></tbody></table></section><section><h2>Jobs</h2><table><thead><tr><th>ID</th><th>Status</th><th>Worker</th><th>Output</th><th>Controls</th></tr></thead><tbody id="jobs"></tbody></table></section><section><h2>Resource pools</h2><form id="pool-form"><input id="pool-name" required placeholder="New pool name"><button>Create pool</button></form><div id="pools"></div></section><section><h2>Latest telemetry</h2><pre id="telemetry">No samples yet.</pre></section></main><script src="/dashboard/app.js"></script></body></html>
